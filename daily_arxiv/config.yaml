# ai-sec 分支配置文件
# 以安全相关 topic 为主题，覆盖 arXiv + 安全四大会 + AI顶会 + 软工顶会

topics:
  - name: "agent sec"
    description: "AI Agent 自身的安全问题（攻击、越狱、滥用等）"
    # arXiv 用于短语 OR 查询；S2 取前 3 个词做语义搜索
    keywords:
      - "agent security"
      - "agent attack"
      - "jailbreak agent"
      - "prompt injection"
      - "multi-agent security"
      - "LLM agent threat"
      - "agent hijacking"
      - "tool-call attack"
    # arXiv 额外类别过滤（可选补充，留空则纯关键词搜索）
    arxiv_categories: ["cs.CR", "cs.AI"]

  - name: "agent for sec"
    description: "使用 AI Agent 辅助安全任务（漏洞检测、渗透测试等）"
    keywords:
      - "vulnerability detection"
      - "penetration testing LLM"
      - "exploit generation"
      - "malware detection AI"
      - "fuzzing LLM"
      - "code security LLM"
      - "threat intelligence AI"
      - "bug detection neural"
    arxiv_categories: ["cs.CR", "cs.SE", "cs.AI"]

  - name: "infra sec"
    description: "基础设施安全（容器、云、供应链等）"
    keywords:
      - "container security"
      - "cloud security"
      - "supply chain attack"
      - "network intrusion"
      - "firmware security"
      - "IoT security"
      - "SBOM security"
      - "zero trust"
    arxiv_categories: ["cs.CR", "cs.NI"]

  - name: "model sec"
    description: "AI 模型本身的安全问题（对抗样本、后门、成员推理等）"
    keywords:
      - "adversarial attack"
      - "backdoor attack"
      - "data poisoning"
      - "membership inference"
      - "model robustness"
      - "model inversion"
      - "trojan neural"
      - "certified defense"
    arxiv_categories: ["cs.CR", "cs.LG", "cs.CV"]

  - name: "frontier sec"
    description: "前沿大模型安全与 AI 治理（安全对齐、红队测试等）"
    keywords:
      - "AI safety"
      - "AI alignment"
      - "red teaming LLM"
      - "jailbreak LLM"
      - "AI governance"
      - "LLM alignment"
      - "harmful content LLM"
      - "RLHF safety"
    arxiv_categories: ["cs.CR", "cs.AI", "cs.CL"]

sources:
  arxiv:
    enabled: true
    max_results: 200       # 每个 topic 每次最多抓取数量（增大避免漏检）
    days_back: 3           # 最近 N 天（覆盖周末休刊）

  semantic_scholar:
    enabled: true
    max_results: 100       # 每个 topic 最多抓取数量
    days_back: 365         # 检索最近 N 天发表的论文
    venues:
      # 安全四大会
      - id: "sp"
        name: "IEEE S&P"
        display: "IEEE S&P"
        match_keywords: ["IEEE Symposium on Security and Privacy", "IEEE S&P", "S&P 20"]
      - id: "ccs"
        name: "ACM CCS"
        display: "ACM CCS"
        match_keywords: ["ACM CCS", "ACM SIGSAC", "Computer and Communications Security"]
      - id: "usenix"
        name: "USENIX Security"
        display: "USENIX Security"
        match_keywords: ["USENIX Security", "USENIX Security Symposium"]
      - id: "ndss"
        name: "NDSS"
        display: "NDSS"
        match_keywords: ["NDSS", "Network and Distributed System Security"]
      # AI 顶会
      - id: "neurips"
        name: "NeurIPS"
        display: "NeurIPS"
        match_keywords: ["NeurIPS", "Neural Information Processing Systems", "NIPS"]
      - id: "icml"
        name: "ICML"
        display: "ICML"
        match_keywords: ["ICML", "International Conference on Machine Learning"]
      - id: "iclr"
        name: "ICLR"
        display: "ICLR"
        match_keywords: ["ICLR", "International Conference on Learning Representations"]
      - id: "aaai"
        name: "AAAI"
        display: "AAAI"
        match_keywords: ["AAAI", "Association for the Advancement of Artificial Intelligence"]
      - id: "ijcai"
        name: "IJCAI"
        display: "IJCAI"
        match_keywords: ["IJCAI", "International Joint Conference on Artificial Intelligence"]
      # 软工顶会
      - id: "icse"
        name: "ICSE"
        display: "ICSE"
        match_keywords: ["ICSE", "International Conference on Software Engineering"]
      - id: "fse"
        name: "FSE"
        display: "FSE/ESEC"
        match_keywords: ["FSE", "ESEC/FSE", "Foundations of Software Engineering", "SIGSOFT FSE"]
      - id: "ase"
        name: "ASE"
        display: "ASE"
        match_keywords: ["ASE", "Automated Software Engineering"]
      - id: "issta"
        name: "ISSTA"
        display: "ISSTA"
        match_keywords: ["ISSTA", "Software Testing and Analysis"]

llm:
  model_name: 'deepseek-v4-pro'
  base_url: 'https://api.deepseek.com'
