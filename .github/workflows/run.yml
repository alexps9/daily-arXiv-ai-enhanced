# ai-sec 分支工作流
# 每日爬取安全相关论文（arXiv + 安全四大会 + AI顶会 + 软工顶会）并使用 DeepSeek 做 AI 增强

name: ai-sec-daily

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv sync

    - name: Crawl arXiv papers (keyword search)
      id: crawl_arxiv
      run: |
        source .venv/bin/activate
        today=$(date -u "+%Y-%m-%d")
        echo "开始爬取 $today 安全相关 arXiv 论文..."

        # 删除今日已存在的文件
        if [ -f "data/${today}.jsonl" ]; then
            echo "删除已存在的今日文件：data/${today}.jsonl"
            rm "data/${today}.jsonl"
        fi

        cd daily_arxiv
        export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        export OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
        export TOKEN_GITHUB=${{ secrets.TOKEN_GITHUB }}
        export LANGUAGE="${{ vars.LANGUAGE }}"
        export MODEL_NAME="${{ vars.MODEL_NAME }}"

        # 爬取 arXiv（关键词搜索）
        scrapy crawl arxiv -o ../data/${today}.jsonl
        echo "crawl_date=$today" >> $GITHUB_OUTPUT
        echo "arXiv 爬取完成"

    - name: Crawl conference papers (Semantic Scholar)
      id: crawl_s2
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_arxiv.outputs.crawl_date }}
        echo "开始爬取会议论文（Semantic Scholar）..."

        cd daily_arxiv
        export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        export OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}

        # 追加到今日文件（-a 模式）
        scrapy crawl semantic_scholar -o ../data/${today}.jsonl
        echo "会议论文爬取完成"

    - name: Check crawl result
      run: |
        today=${{ steps.crawl_arxiv.outputs.crawl_date }}
        if [ ! -f "data/${today}.jsonl" ]; then
            echo "爬取失败，未生成数据文件"
            exit 1
        fi
        echo "数据文件存在：data/${today}.jsonl"
        wc -l "data/${today}.jsonl"

    - name: Check for duplicates
      id: dedup_check
      run: |
        source .venv/bin/activate
        echo "执行去重检查..."

        cd daily_arxiv
        set +e
        python daily_arxiv/check_stats.py
        dedup_exit_code=$?
        set -e

        echo "dedup_exit_code=$dedup_exit_code" >> $GITHUB_OUTPUT
        case $dedup_exit_code in
            0)
                echo "has_new_content=true" >> $GITHUB_OUTPUT
                ;;
            1)
                echo "has_new_content=false" >> $GITHUB_OUTPUT
                echo "skip_reason=no_new_content" >> $GITHUB_OUTPUT
                ;;
            2)
                echo "has_new_content=false" >> $GITHUB_OUTPUT
                echo "skip_reason=processing_error" >> $GITHUB_OUTPUT
                exit 1
                ;;
            *)
                echo "has_new_content=false" >> $GITHUB_OUTPUT
                echo "skip_reason=unknown_error" >> $GITHUB_OUTPUT
                exit 1
                ;;
        esac

    - name: AI Enhancement Processing (DeepSeek)
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_arxiv.outputs.crawl_date }}
        echo "开始 AI 增强处理（DeepSeek）..."

        cd ai
        # 使用 DeepSeek API
        export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        export OPENAI_BASE_URL="https://api.deepseek.com"
        export LANGUAGE="${{ vars.LANGUAGE }}"
        export MODEL_NAME="deepseek-chat"

        python enhance.py --data ../data/${today}.jsonl --max_workers 4

        if [ $? -ne 0 ]; then
            echo "AI 增强处理失败"
            exit 1
        fi
        echo "AI 增强处理完成"

    - name: Convert to Markdown
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        source .venv/bin/activate
        today=${{ steps.crawl_arxiv.outputs.crawl_date }}
        export LANGUAGE="${{ vars.LANGUAGE }}"

        cd to_md
        AI_FILE="../data/${today}_AI_enhanced_${LANGUAGE}.jsonl"

        if [ -f "$AI_FILE" ]; then
            echo "使用 AI 增强文件进行转换：$AI_FILE"
            python convert.py --data "$AI_FILE"
        else
            echo "错误：未找到 AI 增强文件：$AI_FILE"
            exit 1
        fi
        echo "Markdown 转换完成"

    - name: Update file list
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        ls data/*.jsonl | sed 's|data/||' > assets/file-list.txt
        echo "文件列表更新完成"

    - name: Generate password hash and inject into config
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        echo "生成密码哈希..."
        PASSWORD="${{ secrets.ACCESS_PASSWORD }}"

        if [ -z "$PASSWORD" ]; then
          PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
          echo "警告：未设置 ACCESS_PASSWORD，密码保护已禁用"
        else
          PASSWORD_HASH=$(echo -n "$PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
          echo "密码哈希生成成功（长度：${#PASSWORD_HASH}）"
        fi

        if [ -f "js/auth-config.js" ]; then
          sed -i "s/PLACEHOLDER_PASSWORD_HASH/$PASSWORD_HASH/" js/auth-config.js
          echo "密码哈希已注入到 js/auth-config.js"
        else
          echo "错误：js/auth-config.js 不存在！"
          exit 1
        fi

    - name: Summary
      run: |
        if [ "${{ steps.dedup_check.outputs.has_new_content }}" = "true" ]; then
          echo "✅ 工作流完成：成功处理新内容"
        else
          echo "ℹ️ 工作流完成：无新内容（${{ steps.dedup_check.outputs.skip_reason }}）"
        fi

    - name: Inject repository info into data-config.js
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"
        if [ -f "js/data-config.js" ]; then
          sed -i "s/PLACEHOLDER_REPO_OWNER/$REPO_OWNER/g" js/data-config.js
          sed -i "s/PLACEHOLDER_REPO_NAME/$REPO_NAME/g" js/data-config.js
          echo "仓库信息已注入到 js/data-config.js"
        else
          echo "错误：js/data-config.js 不存在！"
          exit 1
        fi

    - name: Commit code changes to ai-sec branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config --global user.email "${{ vars.EMAIL }}"
        git config --global user.name "${{ vars.NAME }}"

        git add js/data-config.js
        git add .github/
        git add -A
        git reset -- data/* assets/file-list.txt 2>/dev/null || true

        if git diff --staged --quiet; then
          echo "无代码变更需要提交"
        else
          git commit -m "chore: update data-config.js with repository info [ai-sec]"
          echo "代码变更已提交到 ai-sec 分支"
        fi

    - name: Push code changes to ai-sec branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config pull.rebase true
        git config rebase.autoStash true
        for i in {1..3}; do
          echo "推送代码尝试 $i"
          if git push origin ai-sec; then
            echo "代码推送成功"
            break
          else
            git pull origin ai-sec --no-edit || true
            if [ $i -eq 3 ]; then
              echo "3次尝试后推送失败"
              exit 1
            fi
          fi
        done

    - name: Prepare data files for data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        today=${{ steps.crawl_arxiv.outputs.crawl_date }}
        mkdir -p /tmp/data_files/data /tmp/data_files/assets
        cp -r data/* /tmp/data_files/data/ 2>/dev/null || true
        cp assets/file-list.txt /tmp/data_files/assets/ 2>/dev/null || true
        echo "数据文件已备份到临时目录"

    - name: Setup and commit to data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config --global user.email "${{ vars.EMAIL }}"
        git config --global user.name "${{ vars.NAME }}"
        today=${{ steps.crawl_arxiv.outputs.crawl_date }}

        rm -rf data/*.jsonl data/*.md assets/file-list.txt 2>/dev/null || true

        if git ls-remote --heads origin data | grep -q data; then
          git fetch origin data:data
          git checkout data
          git pull origin data || true
        else
          git checkout --orphan data
          git rm -rf --cached . 2>/dev/null || true
          mkdir -p data assets
          echo "# Data Branch (ai-sec)" > README.md
          git add README.md
          git commit -m "chore: initialize data branch for ai-sec"
          git push origin data
        fi

        mkdir -p data assets
        cp -r /tmp/data_files/data/* data/ 2>/dev/null || true
        cp /tmp/data_files/assets/file-list.txt assets/ 2>/dev/null || true

        git add data/* 2>/dev/null || true
        git add assets/file-list.txt 2>/dev/null || true

        if git diff --staged --quiet; then
          echo "无数据变更需要提交"
        else
          git commit -m "update: $today ai-sec papers"
          echo "数据变更已提交到 data 分支"
        fi

    - name: Push data changes to data branch
      if: steps.dedup_check.outputs.has_new_content == 'true'
      run: |
        git config pull.rebase true
        git config rebase.autoStash true
        for i in {1..3}; do
          echo "推送数据尝试 $i"
          if git push origin data; then
            echo "数据推送成功"
            break
          else
            git pull origin data --no-edit || true
            if [ $i -eq 3 ]; then
              echo "3次尝试后推送失败"
              exit 1
            fi
          fi
        done
